<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammad Mustafidur Rahman · Computer Engineering</title>
<meta name="description" content="Portfolio of Mohammad Mustafidur Rahman, Computer Engineering student at York University: RISC-V FPGA system-on-chip, ML texture benchmark (75.9% top-1), real-time voice assistant client, and production web work.">
<meta property="og:title" content="Mohammad Mustafidur Rahman · Computer Engineering">
<meta property="og:description" content="Playable portfolio plus a 15-second recruiter view. FPGA, ML and full-stack projects.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0c0d13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%235be3c0'/%3E%3Crect x='14' y='20' width='36' height='18' rx='5' fill='%230c0d13'/%3E%3Crect x='22' y='25' width='6' height='8' fill='%235be3c0'/%3E%3Crect x='36' y='25' width='6' height='8' fill='%235be3c0'/%3E%3C/svg%3E">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#0c0d13; --ink2:#12141d; --panel:#171a25; --panel2:#1e2230; --line:#2a2f42;
  --text:#eef0f6; --muted:#a3a9bd; --faint:#6c7390;
  --amber:#ffb238; --mint:#5be3c0; --rose:#ff6b81; --violet:#a98bff; --sky:#6cc4ff;
  --paper:#f6f5f1; --paper2:#ffffff; --pink:#1a1c24; --pmuted:#565b6b; --pline:#e2e0d9; --paccent:#c26a00; --plink:#0b5cad;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --topbar: 60px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body[data-view="resume"]{background:var(--paper);color:var(--pink)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ============================================================
   TOP BAR + MODE TOGGLE
   ============================================================ */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar);display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(12,13,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body[data-view="resume"] .topbar{background:rgba(246,245,241,.94);border-bottom-color:var(--pline)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.mark{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--mint);display:grid;place-items:center;position:relative}
.mark::before{content:"";width:22px;height:11px;border-radius:3px;background:var(--ink)}
.mark::after{content:"";position:absolute;width:14px;height:5px;top:15px;left:10px;background:linear-gradient(90deg,var(--mint) 0 4px,transparent 4px 10px,var(--mint) 10px 14px)}
.brand-text{min-width:0;line-height:1.15}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-view="resume"] .brand-sub{color:var(--pmuted)}
.spacer{flex:1}
.mode{display:flex;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);gap:2px;flex:0 0 auto}
body[data-view="resume"] .mode{background:#ebe9e2;border-color:var(--pline)}
.mode button{border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-weight:650;font-size:14px;color:var(--muted);transition:background .18s,color .18s,transform .1s}
.mode button:active{transform:scale(.97)}
.mode button svg{width:16px;height:16px;flex:0 0 auto}
.mode button[aria-pressed="true"]{background:var(--amber);color:#1b1300}
body[data-view="resume"] .mode button{color:var(--pmuted)}
body[data-view="resume"] .mode button[aria-pressed="true"]{background:var(--pink);color:#fff}
.mode .hint{font-weight:500;opacity:.75;font-size:12px}
.iconbtn{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted);text-decoration:none}
.iconbtn:hover{color:var(--text);border-color:#3b4260}
.iconbtn svg{width:18px;height:18px}
body[data-view="resume"] .iconbtn{background:#fff;border-color:var(--pline);color:var(--pmuted)}
body[data-view="resume"] .iconbtn:hover{color:var(--pink)}
body[data-view="resume"] #soundBtn{display:none}
@media (max-width:820px){.brand-sub{display:none}}
@media (max-width:640px){
  .brand-text{display:none}
  .mode .hint{display:none}
  .mode button{padding:8px 12px}
  .topbar{gap:8px;padding:0 12px}
  .hide-sm{display:none!important}
}

/* ============================================================
   GAME VIEW
   ============================================================ */
#game{position:relative;height:calc(100vh - var(--topbar));height:calc(100dvh - var(--topbar));display:flex;overflow:hidden}
body[data-view="resume"] #game{display:none}
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hud{position:absolute;left:14px;top:12px;right:14px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(18,20,29,.82);border:1px solid var(--line);color:var(--muted);display:flex;gap:8px;align-items:center}
.pill b{color:var(--text);font-weight:700}
.segs{display:flex;gap:3px}
.segs i{width:10px;height:6px;border-radius:2px;background:#2c3144;display:block;transition:background .3s}
.segs i.on{background:var(--mint)}
.hint-overlay{position:absolute;left:50%;top:60px;max-width:calc(100% - 28px);white-space:normal;text-align:center;line-height:1.9;transform:translateX(-50%);font-family:var(--mono);font-size:13px;color:var(--text);background:rgba(18,20,29,.9);border:1px solid var(--line);padding:9px 14px;border-radius:10px;pointer-events:none;transition:opacity .6s, transform .6s}
.hint-overlay kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--panel2);border:1px solid #3a4057;border-bottom-width:2px;color:var(--amber)}
.hint-overlay.gone{opacity:0;transform:translate(-50%,-8px)}
.helpbtn{pointer-events:auto;cursor:pointer;font:inherit;font-family:var(--mono);font-size:12px}
.helpbtn:hover{color:var(--text);border-color:#3b4260}
.stopname{color:var(--text);max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.stopname,.segs{display:none}}
.touch-only{display:none}
@media (pointer:coarse){.touch-only{display:inline}.mouse-only{display:none}}

/* minimap / route strip */
.route{position:absolute;left:14px;right:14px;bottom:12px;height:34px;display:flex;align-items:center}
.route-track{position:relative;flex:1;height:34px;border-radius:10px;background:rgba(18,20,29,.82);border:1px solid var(--line)}
.route-line{position:absolute;left:14px;right:14px;top:50%;height:2px;background:#2c3144;transform:translateY(-50%)}
.route-stop{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:7px;border:1px solid #3a4057;background:var(--panel);color:var(--muted);font:700 10px var(--mono);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .2s,color .2s,border-color .2s,transform .12s}
.route-stop:hover{transform:scale(1.12);color:var(--text)}
.route-stop.seen{border-color:var(--mint);color:var(--mint)}
.route-stop.here{background:var(--amber);border-color:var(--amber);color:#1b1300}
.route-stop .lbl{display:none}
@media (min-width:900px) and (pointer:fine){.route-stop.here{z-index:2;width:auto;padding:0 8px;transform:translateX(-50%);margin:-12px 0 0 0;gap:6px;display:flex;align-items:center;white-space:nowrap}.route-stop.here:hover{transform:translateX(-50%) scale(1.06)}.route-stop.here .lbl{display:inline;font-weight:600;font-size:10px}}
@media (pointer:coarse){.route-stop{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:11px}}
.route-me{position:absolute;top:2px;width:8px;height:8px;margin-left:-4px;border-radius:2px;background:var(--mint);pointer-events:none;will-change:transform}

/* touch controls */
.pad{position:absolute;bottom:58px;display:none;gap:10px}
.pad.left{left:14px}.pad.right{right:14px}
@media (pointer:coarse){.pad{display:flex}}
.pad button{width:58px;height:58px;border-radius:16px;border:1px solid #3a4057;background:rgba(23,26,37,.78);color:var(--text);display:grid;place-items:center;touch-action:none}
.pad button.on{background:var(--amber);color:#1b1300;border-color:var(--amber)}
.pad svg{width:24px;height:24px}

.toasts{position:absolute;right:14px;top:52px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;z-index:5}
.toast{font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:8px;background:rgba(18,20,29,.94);border:1px solid var(--line);color:var(--text);animation:tin .25s ease-out;max-width:300px}
.toast b{color:var(--mint)}
.toast.fade{opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .4s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* side card */
.card{flex:0 0 400px;max-width:400px;background:var(--ink2);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;position:relative}
.card-inner{padding:22px 22px 28px;animation:cin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);display:flex;gap:8px;align-items:center}
.eyebrow .num{color:var(--faint)}
.card h2{font-size:22px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px}
.card .role{font-size:13px;color:var(--muted);margin:0 0 14px}
.metric{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.metric .v{font:800 28px var(--mono);color:var(--mint);letter-spacing:-.02em;white-space:nowrap}
.metric .l{font-size:13px;color:var(--muted);line-height:1.35}
.card ul{margin:0 0 16px;padding-left:18px}
.card li{font-size:14px;line-height:1.5;margin:0 0 7px;color:#d9dce6}
.card li::marker{color:var(--amber)}
.card p{font-size:14px;line-height:1.55;color:#d9dce6;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{font:600 12px var(--mono);padding:4px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:all .3s}
.chip.got{border-color:rgba(91,227,192,.5);color:var(--mint);background:rgba(91,227,192,.08)}
.demo{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#07080c;margin:0 0 8px}
.demo canvas{display:block;width:100%;height:170px;touch-action:none}
.demo canvas.tall{height:248px}
.caption{font-size:12px;color:var(--faint);line-height:1.45;margin:0 0 16px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;font-weight:650;font-size:13px;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;transition:border-color .15s, transform .1s}
.btn:hover{border-color:var(--amber)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1300}
.btn svg{width:15px;height:15px}
.cardnav{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 22px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--ink2) 70%,rgba(18,20,29,0));z-index:2}
.cardnav .btn{flex:1 1 0;min-width:0;justify-content:center;padding:9px 10px;flex-direction:column;gap:1px;line-height:1.2}
.cardnav .btn .k{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.cardnav .btn .t{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardnav .btn.primary .k{color:rgba(27,19,0,.65)}
.cardnav .btn.mid{flex:0 0 auto;padding:9px 14px}
.cardnav .btn[disabled]{opacity:.35;cursor:default;border-color:var(--line)}
.card.dim .card-inner{opacity:.55;transition:opacity .3s}
.card-inner{transition:opacity .3s}
.stoplist{list-style:none;padding:0!important;margin:12px 0 18px!important}
.stoplist li{margin:0!important}
.stoplist button{width:100%;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:var(--text);font-size:14px}
.stoplist button:hover{background:var(--panel);border-color:var(--line)}
.stoplist .n{font:700 11px var(--mono);color:var(--faint);width:22px}
.stoplist .ok{margin-left:auto;font:700 11px var(--mono);color:var(--mint)}
.jobs{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.job{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.job h3{margin:0;font-size:15px}
.job .meta{font-size:12px;color:var(--muted);margin:2px 0 8px}
.job ul{margin:0}
.job li{font-size:13px}

@media (max-width:860px){
  .cardnav{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  #game{flex-direction:column}
  .stage{flex:0 0 56%}
  .card{flex:1 1 auto;max-width:none;border-left:0;border-top:1px solid var(--line)}
  .card-inner{padding:18px 16px 24px}
  .hint-overlay{top:auto;bottom:58px;left:12px;right:auto;transform:none;font-size:12px;line-height:1.5;width:auto;max-width:calc(100% - 90px);text-align:left}
  .hint-overlay.gone{transform:translateY(8px)}
  .toasts{top:52px;bottom:auto;left:12px;right:12px;align-items:flex-start}
  .toast{max-width:100%}
  .pad{bottom:54px}
  .pad button{width:50px;height:50px}
}

/* ============================================================
   RECRUITER VIEW
   ============================================================ */
#resume{display:none;max-width:1040px;margin:0 auto;padding:36px 20px 64px;color:var(--pink)}
body[data-view="resume"] #resume{display:block}
.r-hero{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--pline)}
.r-hero h1{font-size:clamp(28px,4.4vw,42px);line-height:1.05;letter-spacing:-.03em;margin:0 0 8px}
.r-hero .tag{font-size:16px;color:var(--pmuted);margin:0 0 4px}
.r-hero .avail{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#14532d;background:#dcf5e5;border-radius:999px;padding:5px 11px;margin-top:10px}
.r-hero .avail::before{content:"";width:7px;height:7px;border-radius:50%;background:#16a34a}
.r-contact{display:flex;flex-wrap:wrap;gap:8px}
.r-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;font-weight:650;font-size:14px;text-decoration:none;border:1px solid var(--pline);background:#fff;color:var(--pink);cursor:pointer;white-space:nowrap}
.r-btn:hover{border-color:var(--pink)}
.r-btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
.r-btn svg{width:15px;height:15px}
.r-glance{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 8px}
.r-stat{background:#fff;border:1px solid var(--pline);border-radius:14px;padding:14px 16px}
.r-stat .v{font:800 24px var(--mono);letter-spacing:-.02em;color:var(--paccent)}
.r-stat .l{font-size:13px;color:var(--pmuted);line-height:1.35;margin-top:4px}
.r-sec{margin-top:36px}
.r-sec > h2{font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pmuted);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.r-sec > h2::after{content:"";flex:1;height:1px;background:var(--pline)}
.r-summary{font-size:16px;line-height:1.6;max-width:760px;margin:20px 0 0}
.r-skills{display:grid;grid-template-columns:180px 1fr;gap:10px 18px;font-size:14px;line-height:1.55}
.r-skills dt{font-weight:700}
.r-skills dd{margin:0;color:#2f3341}
.r-projects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.r-proj{background:#fff;border:1px solid var(--pline);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column}
.r-proj h3{margin:0;font-size:16px;letter-spacing:-.01em}
.r-proj .stack{font-size:13px;color:var(--pmuted);margin:4px 0 12px;line-height:1.45}
.r-proj .m{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--pmuted);border-left:3px solid var(--paccent);padding:2px 0 2px 10px;margin-bottom:10px}
.r-proj .m b{font-size:15px;font-weight:800;color:var(--pink);white-space:nowrap}
.r-proj ul,.r-job ul{margin:0 0 10px;padding-left:18px}
.r-proj li,.r-job li{font-size:14px;line-height:1.5;margin-bottom:4px;color:#2f3341}
.r-moredet{margin:-4px 0 10px}.r-moredet summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--pmuted)}.r-moredet ul{margin-top:8px}
@media print{.r-moredet ul{display:block}}
.r-proj .lk{margin-top:auto;display:flex;gap:14px;flex-wrap:wrap}
.r-proj .lk a,.r-job a.lk,.r-more a{font-size:13px;font-weight:650;color:var(--plink);text-decoration:none}
.r-proj .lk a:hover,.r-job a.lk:hover,.r-more a:hover{text-decoration:underline}
.r-job{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 0;border-bottom:1px solid var(--pline)}
.r-job:last-child{border-bottom:0}
.r-job h3{margin:0;font-size:16px}
.r-job .org{font-size:14px;color:var(--pmuted)}
.r-job .when{font:500 13px var(--mono);color:var(--pmuted);text-align:right;white-space:nowrap}
.r-job ul{grid-column:1 / -1;margin-top:8px}
.r-edu{display:grid;grid-template-columns:1fr auto;gap:4px 16px}
.r-edu h3{margin:0;font-size:16px}
.r-edu .when{font:500 13px var(--mono);color:var(--pmuted)}
.r-edu p{grid-column:1/-1;margin:4px 0 0;font-size:14px;color:#2f3341;line-height:1.5}
.r-more{font-size:14px;color:var(--pmuted);margin-top:18px}.r-more ul{margin:6px 0 0;padding-left:18px}.r-more li{margin-bottom:4px;line-height:1.5}
.r-foot{margin-top:40px;font-size:13px;color:var(--pmuted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.r-foot button{background:none;border:0;padding:0;color:var(--plink);font-weight:650;cursor:pointer;font-size:13px}
@media (max-width:760px){
  .r-hero{grid-template-columns:1fr}
  .r-contact{justify-content:flex-start}
  .r-glance{grid-template-columns:1fr 1fr}
  .r-projects{grid-template-columns:1fr}
  .r-skills{grid-template-columns:1fr;gap:2px}
  .r-skills dd{margin-bottom:10px}
  .r-job{grid-template-columns:1fr}
  .r-job .when{text-align:left}
  #resume{padding-top:24px}
}
@media print{
  .topbar,#game,.r-contact .r-btn:not(.keep),.r-foot{display:none!important}
  body{background:#fff!important}
  #resume{display:block!important;padding:0;max-width:none}
  .r-proj,.r-stat{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-view="game">

<header class="topbar">
  <a class="brand" href="#" id="brandLink" aria-label="Home">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand-text">
      <span class="brand-name" id="brandName">Mohammad Mustafidur Rahman</span>
      <span class="brand-sub" id="brandSub">Computer Engineering · York University</span>
    </span>
  </a>
  <span class="spacer"></span>

/* =====================================================================
   2. UTILITIES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

};
function rr(c, x, y, w, h, r) { // rounded rect path, works everywhere
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const ICON = {

};

function copyText(text) {
  const done = () => toast("Copied <b>" + esc(text) + "</b>");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallback());

    document.body.appendChild(t); t.select();

}

/* =====================================================================
   3. SOUND — tiny Web Audio synth, no files, muted by default
   ===================================================================== */
const Sound = {
  on: store.get("mr-sound") === "1", ctx: null,
  ensure() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(f, d = .08, type = "sine", vol = .04, slide = 0, delay = 0) {
    if (!this.on) return; const c = this.ensure(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
  },
  jump() { this.tone(300, .13, "triangle", .035, 1.9); },
  land() { this.tone(120, .06, "sine", .03); },
  collect() { this.tone(880, .07, "sine", .03); this.tone(1318, .1, "sine", .028, 0, .06); },
  open() { this.tone(392, .09, "triangle", .03); this.tone(587, .12, "triangle", .026, 0, .07); },
  ui() { this.tone(660, .05, "sine", .025); },
  done() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .16, "triangle", .03, 0, i * .09)); },
  blip(f) { this.tone(f, .04, "square", .015); }
};
function syncSoundBtn() {
  const b = $("#soundBtn");
  b.setAttribute("aria-pressed", Sound.on ? "true" : "false");
  b.setAttribute("aria-label", Sound.on ? "Sound on. Turn sound off" : "Sound off. Turn sound on");
  $("#soundIcon").innerHTML = Sound.on
    ? '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'
    : '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>';
}
function toggleSound() { Sound.on = !Sound.on; store.set("mr-sound", Sound.on ? "1" : "0"); syncSoundBtn(); Sound.ui(); }

/* =====================================================================

/* =====================================================================

function setView(v) {

/* =====================================================================
   6. MINI DEMOS (inside project cards) — each one shows the real idea
   ===================================================================== */
const Demos = {
  pong(st) {
    const P = st.p || (st.p = { bx: .6, by: .4, vx: -.55, vy: .3, l: .5, score: 0, lives: 3, user: -9, flash: 0 });
    return (c, w, h, dt, t) => {
      const ph = .24, mono = getComputedStyle(document.body).getPropertyValue("--mono");
      P.bx += P.vx * dt; P.by += P.vy * dt * (w / h);
      if (P.by < .03 || P.by > .97) { P.vy *= -1; P.by = clamp(P.by, .03, .97); Sound.blip(440); }
      if (P.bx > .97 && P.vx > 0) { P.vx *= -1; P.bx = .97; Sound.blip(440); }
      const userActive = t - P.user < 2.5;
      if (!userActive) P.l += clamp((P.by - P.l) * 6 * dt, -.8 * dt, .8 * dt);
      P.l = clamp(P.l, ph / 2, 1 - ph / 2);
      if (P.bx < .045 && P.vx < 0 && Math.abs(P.by - P.l) < ph / 2 + .03) { P.vx = Math.abs(P.vx) * 1.05; P.vy += (P.by - P.l) * 1.6; P.score += 10; Sound.blip(660); }
      P.vx = clamp(P.vx, -1.4, 1.4); P.vy = clamp(P.vy, -.9, .9);
      if (P.bx < -.05) { P.lives--; P.flash = .4; Sound.blip(160); if (P.lives <= 0) { P.lives = 3; P.score = 0; } Object.assign(P, { bx: .6, by: .3 + Math.random() * .4, vx: -.55, vy: (Math.random() - .5) * .6 }); }
      P.flash = Math.max(0, P.flash - dt);
      c.fillStyle = P.flash > 0 ? "#2a0a10" : "#000"; c.fillRect(0, 0, w, h);
      c.fillStyle = "#e9ffe0"; c.fillRect(w - 4, 0, 4, h);
      c.font = "700 18px " + mono; c.textAlign = "right"; c.fillStyle = "#ff4d4d";
      c.fillText(String(P.score).padStart(5, "0"), w - 14, 26);
      c.textAlign = "left"; c.fillText("♥".repeat(P.lives), 30, 26);
      const phh = ph * h;
      c.fillStyle = userActive ? "#ffb238" : "#e9ffe0"; c.fillRect(10, P.l * h - phh / 2, 6, phh);
      c.fillStyle = "#e9ffe0"; c.fillRect(P.bx * w - 4, P.by * h - 4, 8, 8);
      c.fillStyle = "rgba(0,0,0,.25)"; for (let y = 0; y < h; y += 3) c.fillRect(0, y, w, 1);
      c.font = "600 10px " + mono; c.fillStyle = "rgba(233,255,224,.45)";
      c.fillText(userActive ? "YOU'RE PLAYING" : "DEMO MODE · POINT TO PLAY", 30, h - 9);
    };
  },
  pongPointer(st, yFrac, t) { if (st.p) { st.p.l = yFrac; st.p.user = t; } },

  bars(st) {
    st.t0 = st.t0 ?? 0;
    const rows = [["Chance (1/47)", 2.1, "#3a4057"], ["3-layer CNN from scratch", 19.0, "#6c7390"], ["Classical: Gabor+Fourier+LBP → SVM", 31.0, "#ffb238"], ["ResNet-50, frozen", 64.3, "#4a8f80"], ["EfficientNetV2-S, fine-tuned", 72.3, "#4fb89f"], ["ConvNeXt-Tiny + TTA", 74.8, "#55cfb0"], ["Ensemble + TTA", 75.9, "#5be3c0"]];
    return (c, w, h, dt) => {
      st.t0 += dt; const k = REDUCED ? 1 : 1 - Math.pow(1 - clamp(st.t0 / 1.3, 0, 1), 3);
      c.fillStyle = "#07080c"; c.fillRect(0, 0, w, h);
      const mono = getComputedStyle(document.body).getPropertyValue("--mono");
      const left = 14, right = w - 58, rowH = (h - 16) / rows.length;
      c.strokeStyle = "rgba(255,255,255,.06)"; c.lineWidth = 1;
      for (let p = 0; p <= 100; p += 25) { const x = left + (right - left) * p / 100; c.beginPath(); c.moveTo(x, 8); c.lineTo(x, h - 8); c.stroke(); }
      rows.forEach(([label, val, col], i) => {
        const y = 8 + i * rowH, last = i === rows.length - 1;
        c.fillStyle = last ? "#eef0f6" : "#a3a9bd"; c.font = (last ? "700" : "500") + " 11px " + (getComputedStyle(document.body).getPropertyValue("--sans").trim() || "sans-serif"); c.textAlign = "left"; c.fillText(label, left, y + 11);
        const bw = (right - left) * (val / 100) * k;
        c.fillStyle = col; rr(c, left, y + 16, Math.max(bw, 2), 8, 4); c.fill();
        c.fillStyle = last ? "#5be3c0" : "#eef0f6"; c.font = "800 11px " + mono;
        c.fillText((val * k).toFixed(1) + "%", left + Math.max(bw, 2) + 6, y + 24);
      });
    };
  },

  stream(st) {
    const pk = st.pk || (st.pk = []); st.acc = 0; st.ph = 0;
    return (c, w, h, dt, t) => {
      const mono = getComputedStyle(document.body).getPropertyValue("--mono");
      c.fillStyle = "#07080c"; c.fillRect(0, 0, w, h);
      const bx = 14, bw = 92, bh = 46, by = 18, ax = w - 14 - bw, lineY = by + bh / 2;
      // wire
      c.strokeStyle = "#2a2f42"; c.lineWidth = 2; c.setLineDash([5, 5]); c.lineDashOffset = -t * 30;
      c.beginPath(); c.moveTo(bx + bw, lineY - 7); c.lineTo(ax, lineY - 7); c.moveTo(bx + bw, lineY + 7); c.lineTo(ax, lineY + 7); c.stroke(); c.setLineDash([]);
      c.fillStyle = "#6c7390"; c.font = "600 10px " + mono; c.textAlign = "center"; c.fillText("WebSocket", w / 2, lineY + 26);
      // nodes
      [[bx, "React Native", "#5be3c0"], [ax, "AWS", "#ffb238"]].forEach(([x, lb, col]) => {
        c.fillStyle = "#171a25"; rr(c, x, by, bw, bh, 9); c.fill(); c.strokeStyle = col; c.lineWidth = 1.5; c.stroke();
        c.fillStyle = "#eef0f6"; c.font = "700 11px " + mono; c.fillText(lb, x + bw / 2, by + bh / 2 + 4);

      c.fillStyle = "rgba(91,227,192,.12)"; c.beginPath(); c.arc(0, 0, 22, 0, 6.283); c.fill();
      c.fillStyle = "#1b2a2a"; rr(c, -12, -12, 24, 24, 5); c.fill(); c.strokeStyle = "#5be3c0"; c.lineWidth = 2; c.stroke();
      c.fillStyle = "#5be3c0"; for (let i = -1; i <= 1; i++) { c.fillRect(-17, i * 6 - 1, 4, 2); c.fillRect(13, i * 6 - 1, 4, 2); }
      c.fillRect(-4, -4, 8, 8);
      c.restore();
      c.globalAlpha = near ? 1 : .55; c.fillStyle = "#cfd3e0"; c.font = "600 12px " + MONO; c.fillText(k2.s, k2.x, y - 24); c.globalAlpha = 1;
    }

    drawPlayer(c);

    for (const p of parts) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.col; c.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
    c.globalAlpha = 1;
    c.restore();
  }

  function drawZone(c, z) {
    const on = active === z, done = seen.has(z.idx);
    if (z.type === "intro") {
      c.textAlign = "left"; c.fillStyle = "#eef0f6";
      c.font = "800 44px " + SANS; c.fillText(CONFIG.short + ".", z.x - 150, 150);
      c.font = "600 17px " + SANS; c.fillStyle = "#a3a9bd";
      c.fillText("Computer Engineering · York University", z.x - 150, 182);
      c.fillText("FPGA · machine learning · full-stack", z.x - 150, 206);
      const ax = z.x + 190 + Math.sin(T * 4) * 8;
      c.strokeStyle = "#ffb238"; c.lineWidth = 4; c.lineCap = "round"; c.lineJoin = "round";
      c.beginPath(); c.moveTo(ax - 30, 300); c.lineTo(ax, 300); c.moveTo(ax - 12, 286); c.lineTo(ax + 2, 300); c.lineTo(ax - 12, 314); c.stroke();
      c.lineCap = "butt"; c.font = "700 12px " + MONO; c.fillStyle = "#ffb238"; c.textAlign = "center"; c.fillText("WALK RIGHT", ax - 14, 334);
      return;
    }
    const w = z.type === "contact" ? 130 : 210, h = z.type === "contact" ? 90 : 128, x = z.x - w / 2, y = GROUND - h;
    // halo when active
    if (on) { const hg = c.createRadialGradient(z.x, GROUND - h / 2, 20, z.x, GROUND - h / 2, 220); hg.addColorStop(0, hexA(z.color, .22)); hg.addColorStop(1, hexA(z.color, 0)); c.fillStyle = hg; c.fillRect(z.x - 230, GROUND - h - 140, 460, h + 140); }
    // pins
    c.fillStyle = "#3a4057"; for (let px = x + 14; px < x + w - 10; px += 18) c.fillRect(px, GROUND - 6, 6, 6);
    // body
    c.fillStyle = on ? "#20243a" : "#191c2b"; rr(c, x, y, w, h - 6, 12); c.fill();
    c.strokeStyle = on ? z.color : "#2f3550"; c.lineWidth = 2; c.stroke();
    c.fillStyle = z.color; rr(c, x, y, w, 6, 3); c.fill();
    c.fillStyle = "#3a4057"; c.beginPath(); c.arc(x + 14, y + 20, 4, 0, 6.283); c.fill();
    if (z.type === "contact") { // antenna
      c.strokeStyle = z.color; c.lineWidth = 3; c.beginPath(); c.moveTo(z.x, y); c.lineTo(z.x, y - 70); c.stroke();
      for (let r2 = 1; r2 <= 3; r2++) { c.globalAlpha = (Math.sin(T * 3 - r2) + 1) / 2 * .7; c.beginPath(); c.arc(z.x, y - 70, r2 * 12, -2.4, -.74); c.stroke(); c.beginPath(); c.arc(z.x, y - 70, r2 * 12, -2.4 + Math.PI, -.74 + Math.PI); c.globalAlpha = 1; }
    }
    // number + label
    c.textAlign = "center"; c.fillStyle = on ? "#eef0f6" : "#6c7390"; c.font = "800 " + (z.type === "contact" ? 26 : 34) + "px " + MONO;
    c.fillText(String(z.idx + 1).padStart(2, "0"), z.x, y + h / 2 + 8);
    c.font = "700 15px " + SANS; c.fillStyle = on ? "#eef0f6" : "#a3a9bd";
    c.fillText(z.label, z.x, y - (z.type === "contact" ? 84 : 18));
    // beacon
    const by = y - (z.type === "contact" ? 104 : 42), pulse = (Math.sin(T * 4 + z.idx) + 1) / 2;
    c.fillStyle = done ? "#5be3c0" : hexA("#ffb238", .5 + pulse * .5);
    c.beginPath(); c.arc(z.x, by, done ? 5 : 4 + pulse * 2, 0, 6.283); c.fill();
    if (!done) { c.strokeStyle = hexA("#ffb238", (1 - pulse) * .6); c.lineWidth = 2; c.beginPath(); c.arc(z.x, by, 8 + pulse * 10, 0, 6.283); c.stroke(); }
  }

  function drawPlayer(c) {
    const air = GROUND - P.y;
    // shadow
    c.fillStyle = "rgba(0,0,0,.45)"; const sw = clamp(1 - air / 220, .35, 1);
    c.beginPath(); c.ellipse(P.x, GROUND + 2, 18 * sw, 4 * sw, 0, 0, 6.283); c.fill();
    const sq = P.sq, sx = 1 + sq * .6, sy = 1 - sq * .6, lean = clamp(P.vx / 1400, -.25, .25);
    c.save(); c.translate(P.x, P.y); c.rotate(lean * .5); c.scale(sx, sy);
    // antenna
    c.strokeStyle = "#5be3c0"; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -36); c.quadraticCurveTo(-P.vx * .01, -46, -P.vx * .015, -50); c.stroke();
    c.fillStyle = "#ffb238"; c.beginPath(); c.arc(-P.vx * .015, -50, 3.5, 0, 6.283); c.fill();
    // body
    c.fillStyle = "#5be3c0"; rr(c, -17, -36, 34, 36, 9); c.fill();
    c.fillStyle = "rgba(0,0,0,.14)"; rr(c, -17, -10, 34, 10, 5); c.fill();
    // visor + eyes
    c.fillStyle = "#0c0d13"; rr(c, -12, -29, 24, 14, 5); c.fill();
    const eh = P.blink < 0 ? 1.5 : 7, ex = P.face * 2.5;
    c.fillStyle = "#5be3c0"; c.fillRect(-7 + ex, -22 - eh / 2, 4, eh); c.fillRect(3 + ex, -22 - eh / 2, 4, eh);
    c.restore();
  }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }

  /* ---- side card ---- */
  function chips(list) { return '<div class="chips">' + list.map(s => `<span class="chip${got.has(s) ? " got" : ""}" data-skill="${esc(s)}">${esc(s)}</span>`).join("") + "</div>"; }
  function linkBtns(links) { return links.length ? '<div class="links">' + links.map(l => `<a class="btn" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ${ICON.ext}</a>`).join("") + "</div>" : ""; }
  function eyebrow(z, kind) { return `<div class="eyebrow"><span class="num">${String(z.idx + 1).padStart(2, "0")}/${String(zones.length).padStart(2, "0")}</span>${esc(kind)}</div>`; }
  function markChips() { cardEl.querySelectorAll(".chip[data-skill]").forEach(el => el.classList.toggle("got", got.has(el.dataset.skill))); }

  let showRoute = false, shown = null;
  function renderCard() {
    demo = null; demoCv = null;
    const C = CONFIG, z = showRoute ? null : shown;
    let html = "";
    if (!z) {
      html = `<div class="eyebrow">Route</div><h2>Where to next?</h2>
        <p class="role">Walk, or jump straight to a stop.</p>
        <ul class="stoplist">${zones.map(s => `<li><button type="button" data-stop="${s.idx}"><span class="n">${String(s.idx + 1).padStart(2, "0")}</span>${esc(s.type === "project" ? s.p.title : s.label)}${seen.has(s.idx) ? '<span class="ok">SEEN</span>' : ""}</button></li>`).join("")}</ul>
        <div class="links"><button type="button" class="btn primary" data-go="resume">Recruiter view</button><a class="btn" href="${esc(C.resumePdf)}" download>${ICON.file} PDF</a></div>`;
    } else if (z.type === "intro") {
      html = `${eyebrow(z, "Hello")}<h2>${esc(C.name)}</h2>
        <p class="role">${esc(C.headline)} · ${esc(C.education.when)} · ${esc(C.location)}</p>
        <p>${esc(C.summary)}</p>
        <div class="metric"><span class="v">${C.projects.length}</span><span class="l">projects ahead. Walk right to visit each one; the glowing chips on the way are the skills each project used.</span></div>
        <div class="links"><button type="button" class="btn" data-go="resume">Skip to the one-page resume</button></div>`;
    } else if (z.type === "edu") {
      const E = C.education;
      html = `${eyebrow(z, "Education")}<h2>${esc(E.degree)}</h2>
        <p class="role">${esc(E.school)} · ${esc(E.place)} · ${esc(E.when)}</p>
        <p style="color:#a3a9bd;font-size:13px;margin-bottom:8px">Relevant coursework</p>${chips(E.coursework).replace(/ got/g, "")}`;
    } else if (z.type === "project") {
      const p = z.p;
      html = `${eyebrow(z, p.kind)}<h2>${esc(p.title)}</h2>${p.role ? `<p class="role">${esc(p.role)}</p>` : '<div style="height:8px"></div>'}
        ${p.metric ? `<div class="metric"><span class="v">${esc(p.metric.v)}</span><span class="l">${esc(p.metric.l)}</span></div>` : ""}
        ${p.demo ? `<div class="demo"><canvas id="demoCv" class="${p.demo === "bars" ? "tall" : ""}" aria-label="Animated illustration"></canvas></div><p class="caption">${esc(p.caption || "")}</p>` : ""}
        <ul>${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
        ${chips(p.stack)}
        <div class="links">${p.links.map(l => `<a class="btn primary" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ${ICON.ext}</a>`).join("")}</div>`;
    } else if (z.type === "work") {
      html = `${eyebrow(z, "Experience")}<h2>Work history</h2><p class="role">Most recent first.</p>
        <div class="jobs">${C.experience.map(j => `<div class="job"><h3>${esc(j.role)}</h3><div class="meta">${esc(j.org)} · ${esc(j.when)}</div><ul>${j.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>${j.link ? `<a class="btn" style="margin-top:8px" href="${esc(j.link.href)}" target="_blank" rel="noopener">${esc(j.link.label)} ${ICON.ext}</a>` : ""}</div>`).join("")}</div>`;
    } else if (z.type === "contact") {
      html = `${eyebrow(z, "Contact")}<h2>Let's talk.</h2><p class="role">${esc(C.availability)}.</p>
        <div class="metric"><span class="v">${got.size}/${tokens.length}</span><span class="l">skills collected on the way. Every one is backed by a project above.</span></div>
        <div class="links" style="margin-bottom:12px">
          <a class="btn primary" href="mailto:${esc(C.email)}">${ICON.mail} Email me</a>
          <button type="button" class="btn" data-copy="${esc(C.email)}">${ICON.copy} Copy email</button>
          <a class="btn" href="${telHref}">${ICON.phone} ${esc(C.phone)}</a>
        </div>
        <div class="links" style="margin-bottom:12px">
          <a class="btn" href="${esc(C.linkedin)}" target="_blank" rel="noopener">LinkedIn ${ICON.ext}</a>
          <a class="btn" href="${esc(C.github)}" target="_blank" rel="noopener">GitHub ${ICON.ext}</a>
          <a class="btn" href="${esc(C.resumePdf)}" download>${ICON.file} PDF resume</a>
        </div>
        ${C.moreRepos.length ? `<p style="color:#a3a9bd;font-size:13px;margin:8px 0 6px">More on GitHub</p><ul>${C.moreRepos.map(r => `<li><a href="${esc(r.href)}" target="_blank" rel="noopener" style="color:#eef0f6">${esc(r.label)} ↗</a>${r.desc ? ` <span style="color:#a3a9bd">· ${esc(r.desc)}</span>` : ""}</li>`).join("")}</ul>` : ""}
        <div class="links"><button type="button" class="btn" data-go="resume">One-page recruiter view</button></div>`;
    }
    const cur = z ? z.idx : -1, prev = z ? zones[cur - 1] : null, next = z ? zones[cur + 1] : zones[nearestAhead()];
    const nav = `<nav class="cardnav" aria-label="Stops">
        <button type="button" class="btn" ${prev ? `data-stop="${prev.idx}"` : "disabled"} aria-label="Previous stop${prev ? ": " + esc(prev.label) : ""}"><span class="k">← Back</span><span class="t">${prev ? esc(prev.label) : "Start"}</span></button>
        <button type="button" class="btn mid" data-route="1" aria-label="All stops">${z ? "All stops" : "Close"}</button>
        <button type="button" class="btn ${z && z.idx === 0 ? "primary" : ""}" ${next ? `data-stop="${next.idx}"` : "disabled"} aria-label="Next stop${next ? ": " + esc(next.label) : ""}"><span class="k">Next →</span><span class="t">${next ? esc(next.label) : "End"}</span></button>
      </nav>`;
    cardEl.innerHTML = `<div class="card-inner">${html}</div>${nav}`;
    cardEl.classList.remove("dim");
    cardEl.scrollTop = 0;
    zones.forEach(s => { s.btn.classList.toggle("here", s === active); s.btn.classList.toggle("seen", seen.has(s.idx)); });

    if (z && z.type === "project" && z.p.demo && Demos[z.p.demo]) {
      demoCv = $("#demoCv"); demoCtx = demoCv.getContext("2d");
      const st = demoState[z.p.id] || (demoState[z.p.id] = {});
      demo = Demos[z.p.demo](st); sizeDemo();
      if (z.p.demo === "pong") {
        const mv = e => { const r = demoCv.getBoundingClientRect(); Demos.pongPointer(st, clamp((e.clientY - r.top) / r.height, 0, 1), T); };
        demoCv.addEventListener("pointermove", mv); demoCv.addEventListener("pointerdown", mv);
      }
    }
  }
  function sizeDemo() {
    if (!demoCv) return; const r = demoCv.getBoundingClientRect(); demoDpr = Math.min(window.devicePixelRatio || 1, 2);
    demoW = r.width; demoH = r.height; demoCv.width = Math.round(demoW * demoDpr); demoCv.height = Math.round(demoH * demoDpr);
  }
  cardEl.addEventListener("click", e => {
    const s = e.target.closest("[data-stop]"), g = e.target.closest("[data-go]"), cp = e.target.closest("[data-copy]"), rt = e.target.closest("[data-route]");
    if (rt) { showRoute = !showRoute || !shown; renderCard(); Sound.ui(); return; }
    if (s) { const z = zones[+s.dataset.stop]; if (z) travel(z); }
    if (g) setView(g.dataset.go);
    if (cp) copyText(cp.dataset.copy);
  });

  function nearestAhead() { for (const z of zones) if (z.x > P.x + 20) return z.idx; return zones.length - 1; }
  function updateHud() {
    const cz = shown || zones[0];
    $("#hudStop").textContent = (cz.idx + 1) + "/" + zones.length; $("#hudStopName").textContent = cz.type === "project" ? cz.p.short : cz.label;
    $("#hudStack").textContent = got.size + "/" + tokens.length;
    const segs = $("#hudSegs").children; zones.forEach((z, i) => segs[i] && segs[i].classList.toggle("on", seen.has(z.idx)));
    zones.forEach(s => s.btn && s.btn.classList.toggle("seen", seen.has(s.idx)));
  }

  /* ---- loop ---- */
  function frame(now) {
    if (!running) return;
    const dt = Math.min(.034, Math.max(0, (now - last) / 1000)); last = now;
    update(dt); render();
    if (demo && demoCtx) { demoCtx.setTransform(demoDpr, 0, 0, demoDpr, 0, 0); demo(demoCtx, demoW, demoH, dt, T); }
    raf = requestAnimationFrame(frame);
  }
  function start() { if (running) return; running = true; resize(); sizeDemo(); last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); input.l = input.r = false; }

  function init() {
    build(); resize(); shown = active = zones[0]; seen.add(0); renderCard(); updateHud();
    window.addEventListener("keydown", e => onKey(e, true));
    window.addEventListener("keyup", e => onKey(e, false));
    window.addEventListener("blur", () => { input.l = input.r = false; });
    cv.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("wheel", onWheel, { passive: false });
    bindPad("#padJ", "j");
    if (window.ResizeObserver) { new ResizeObserver(() => { resize(); sizeDemo(); if (!running) render(); }).observe(stage); new ResizeObserver(() => sizeDemo()).observe(cardEl); }
    else window.addEventListener("resize", () => { resize(); sizeDemo(); });
    const hb = $("#helpBtn"), hint = $("#hint");
    hb.addEventListener("click", () => { const open = hint.classList.toggle("gone") === false; hb.setAttribute("aria-expanded", open); });
    hintTimer = setTimeout(hideHint, 12000);
  }
  return { init, start, stop, render: () => render() };
})();

/* =====================================================================
   8. TOASTS + BOOT
   ===================================================================== */
function toast(html, ms = 2200) {
  const box = $("#toasts"); if (!box) return;
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html; box.appendChild(t);
  const maxT = window.innerWidth < 860 ? 1 : 3;
  while (box.children.length > maxT) box.removeChild(box.firstChild);
  setTimeout(() => { t.classList.add("fade"); setTimeout(() => t.remove(), 450); }, ms);
}

(function boot() {
  $("#brandName").textContent = CONFIG.name;
  $("#ghTop").href = CONFIG.github; $("#liTop").href = CONFIG.linkedin;
  $("#modeGame").addEventListener("click", () => setView("game"));
  $("#modeResume").addEventListener("click", () => setView("resume"));
  $("#soundBtn").addEventListener("click", toggleSound);
  $("#brandLink").addEventListener("click", e => { e.preventDefault(); window.scrollTo(0, 0); });
  // mouse clicks shouldn't leave focus on buttons (so Space keeps meaning "jump")
  document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail > 0) b.blur(); });
  syncSoundBtn();
  renderResume();
  Game.init();
  const wantResume = /^#(resume|recruiter|cv)$/i.test(location.hash);
  document.body.dataset.view = wantResume ? "resume" : "game";
  $("#modeGame").setAttribute("aria-pressed", !wantResume);
  $("#modeResume").setAttribute("aria-pressed", wantResume);
  if (wantResume) document.title = CONFIG.name + " · Resume"; else Game.start();
  window.addEventListener("hashchange", () => setView(/^#(resume|recruiter|cv)$/i.test(location.hash) ? "resume" : "game"));
})();
</script>
</body>
</html>
